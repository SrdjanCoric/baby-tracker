name: Android E2E Tests

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite to run'
        required: false
        default: 'smoke'
        type: choice
        options:
          - smoke
          - regression

jobs:
  e2e-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start Supabase
        run: |
          supabase start
          supabase db push

      - name: Get Supabase credentials
        id: supabase
        run: |
          echo "ANON_KEY=$(supabase status --output json | jq -r '.ANON_KEY')" >> $GITHUB_OUTPUT

      - name: Create .env file
        run: |
          cat > .env << EOF
          EXPO_PUBLIC_SUPABASE_URL=http://10.0.2.2:54321
          EXPO_PUBLIC_SUPABASE_ANON_KEY=${{ steps.supabase.outputs.ANON_KEY }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID=test-ios-client-id
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID=test-web-client-id
          EOF

      - name: Seed test data
        run: npm run e2e:seed

      - name: Prebuild Android
        run: npx expo prebuild --platform android --clean

      - name: Build Android app
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Run E2E tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            adb install android/app/build/outputs/apk/debug/app-debug.apk
            SUITE="${{ github.event.inputs.suite || 'smoke' }}"
            maestro test "e2e/suites/${SUITE}.yaml" --format junit --output e2e-results.xml
        continue-on-error: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-android
          path: |
            e2e-results.xml
            ~/.maestro/tests/**/*

      - name: Cleanup
        if: always()
        run: |
          npm run e2e:cleanup || true
          supabase stop || true
