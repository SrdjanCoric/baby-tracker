name: Deploy to App Stores

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Marketing version already committed in app.json"
        required: true
        type: string
      platform:
        description: "Platform to build"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - ios
          - android

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.validate.outputs.version }}
      source-sha: ${{ steps.validate.outputs.source-sha }}
    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"

      - name: Validate release metadata
        id: validate
        run: node scripts/validate-release.mjs
        env:
          RELEASE_VERSION: ${{ github.event.inputs.version }}
          RELEASE_PLATFORM: ${{ github.event.inputs.platform || 'all' }}
          RELEASE_METADATA_PATH: release-metadata.json

      - name: Record release metadata
        run: |
          echo "## Release source" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat release-metadata.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload release metadata
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata-${{ github.run_id }}
          path: release-metadata.json
          if-no-files-found: error
          retention-days: 90

  test:
    needs: release-metadata
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.release-metadata.outputs.source-sha }}

  build-ios:
    needs: [release-metadata, test]
    if: >-
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'ios' ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: read
    outputs:
      build-id: ${{ steps.build.outputs.build-id }}
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-metadata.outputs.source-sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: "21.1.0"
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS
        id: build
        shell: bash
        run: |
          set -euo pipefail
          eas build --platform ios --profile production --non-interactive --wait --json > eas-ios-build.json
          BUILD_ID=$(node -e 'const data=JSON.parse(require("node:fs").readFileSync("eas-ios-build.json", "utf8")); const build=Array.isArray(data) ? data[0] : data; if (!build?.id) throw new Error("EAS did not return a build ID"); process.stdout.write(build.id)')
          echo "build-id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "iOS EAS build: \`$BUILD_ID\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload iOS build record
        uses: actions/upload-artifact@v4
        with:
          name: eas-ios-build-${{ github.run_id }}
          path: eas-ios-build.json
          if-no-files-found: error
          retention-days: 90

  build-android:
    needs: [release-metadata, test]
    if: >-
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'android' ||
      github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: read
    outputs:
      build-id: ${{ steps.build.outputs.build-id }}
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-metadata.outputs.source-sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: "21.1.0"
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android
        id: build
        shell: bash
        run: |
          set -euo pipefail
          eas build --platform android --profile production --non-interactive --wait --json > eas-android-build.json
          BUILD_ID=$(node -e 'const data=JSON.parse(require("node:fs").readFileSync("eas-android-build.json", "utf8")); const build=Array.isArray(data) ? data[0] : data; if (!build?.id) throw new Error("EAS did not return a build ID"); process.stdout.write(build.id)')
          echo "build-id=$BUILD_ID" >> "$GITHUB_OUTPUT"
          echo "Android EAS build: \`$BUILD_ID\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Android build record
        uses: actions/upload-artifact@v4
        with:
          name: eas-android-build-${{ github.run_id }}
          path: eas-android-build.json
          if-no-files-found: error
          retention-days: 90

  submit-ios:
    needs: [release-metadata, test, build-ios]
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: read
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-metadata.outputs.source-sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: "21.1.0"
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Submit validated iOS build to App Store
        run: |
          eas submit --platform ios --profile production --id "${{ needs.build-ios.outputs.build-id }}" --non-interactive
          echo "Submitted iOS EAS build: \`${{ needs.build-ios.outputs.build-id }}\`" >> "$GITHUB_STEP_SUMMARY"
        env:
          EXPO_APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.EXPO_APPLE_APP_SPECIFIC_PASSWORD }}

  submit-android:
    needs: [release-metadata, test, build-android]
    runs-on: ubuntu-latest
    environment: production-release
    permissions:
      contents: read
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-metadata.outputs.source-sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: "21.1.0"
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Write Google Play service account key
        run: printf '%s' "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" > google-play-service-account.json
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

      - name: Submit validated Android build to Google Play
        run: |
          eas submit --platform android --profile production --id "${{ needs.build-android.outputs.build-id }}" --non-interactive
          echo "Submitted Android EAS build: \`${{ needs.build-android.outputs.build-id }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup service account key
        if: always()
        run: rm -f google-play-service-account.json
