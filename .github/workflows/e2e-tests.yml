name: E2E Tests

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'  # Daily at 6am UTC
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  e2e-ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run Expo prebuild
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build iOS app
        run: |
          xcodebuild -workspace ios/SofiBabyTracker.xcworkspace \
            -scheme SofiBabyTracker \
            -sdk iphonesimulator \
            -configuration Release \
            -derivedDataPath build \
            -destination 'platform=iOS Simulator,name=iPhone 15 Pro,OS=latest' \
            build

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Boot iOS Simulator
        run: |
          xcrun simctl boot "iPhone 15 Pro" || true
          xcrun simctl bootstatus "iPhone 15 Pro" -b

      - name: Install app on simulator
        run: |
          xcrun simctl install booted build/Build/Products/Release-iphonesimulator/SofiBabyTracker.app

      - name: Run E2E tests
        run: |
          maestro test e2e/ \
            --format junit \
            --output e2e-results-ios.xml \
            --include-tags critical || true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-ios
          path: e2e-results-ios.xml

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-screenshots-ios
          path: ~/.maestro/tests/

  e2e-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Android app
        run: |
          npx expo prebuild --platform android --clean
          cd android
          ./gradlew assembleRelease

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            adb install android/app/build/outputs/apk/release/app-release.apk
            maestro test e2e/ \
              --format junit \
              --output e2e-results-android.xml \
              --include-tags critical || true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-android
          path: e2e-results-android.xml

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-screenshots-android
          path: ~/.maestro/tests/

  report:
    needs: [e2e-ios, e2e-android]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download iOS results
        uses: actions/download-artifact@v4
        with:
          name: e2e-results-ios
          path: results/
        continue-on-error: true

      - name: Download Android results
        uses: actions/download-artifact@v4
        with:
          name: e2e-results-android
          path: results/
        continue-on-error: true

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: always()
        with:
          files: results/*.xml
          check_name: E2E Test Results
          comment_mode: always
