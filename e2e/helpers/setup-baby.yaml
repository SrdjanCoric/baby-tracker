appId: com.sofibaby.app

---
# Create a baby during onboarding
# Requires: BABY_NAME env variable
- runFlow:
    when:
      visible: "Add a baby"
    commands:
      - tapOn:
          id: "baby-name-input"
      - inputText: "${BABY_NAME}"
      - tapOn:
          id: "baby-birthdate-picker"
      - tapOn:
          text: "Confirm"
          optional: true
      - tapOn:
          id: "continue-button"

---
# Add another baby from settings
- runFlow:
    when:
      visible:
        id: "add-baby-button"
    commands:
      - tapOn:
          id: "add-baby-button"
      - assertVisible: "Add a baby"

---
# Switch to different baby
- runFlow:
    when:
      visible:
        id: "baby-switcher"
    commands:
      - tapOn:
          id: "baby-switcher"
      - assertVisible:
          id: "baby-list"
