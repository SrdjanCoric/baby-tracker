appId: com.sofibaby.app

---
# From Home, open the baby selector and add "Second E2E Baby" (boy, born today).
# New babies require a birth date; Done on the picker accepts today.
# The new baby becomes the selected one.
- tapOn:
    id: "selected-baby-name"
- assertVisible:
    text: "Add Another Baby"
- tapOn:
    text: "Add Another Baby"
- tapOn:
    id: "baby-name-input"
- inputText: "Second E2E Baby"
- pressKey: Enter
- tapOn:
    id: "birth-date-picker"
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          id: "birth-date-done-button"
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn: "OK"
- tapOn:
    id: "gender-male"
- tapOn:
    id: "save-baby-button"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 15000
- assertVisible:
    id: "selected-baby-name"
    text: "Second E2E Baby"
