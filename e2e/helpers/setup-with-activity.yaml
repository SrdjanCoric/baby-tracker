appId: com.sofibaby.app

---
# Setup baby and create a tummy time entry for timeline tests
- runFlow: ./setup-with-baby.yaml

# Create a tummy time entry
- tapOn:
    id: "tummyTime-card"

- tapOn:
    id: "start-timer-button"

- extendedWaitUntil:
    visible:
      id: "stop-timer-button"
    timeout: 3000

- tapOn:
    id: "stop-timer-button"

- assertVisible:
    id: "home-screen"
