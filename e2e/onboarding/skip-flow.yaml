# Onboarding - Skip Flow Tests
# Test IDs: ONB-002, ONB-011, ONB-012
appId: com.sofibaby.app
tags:
  - onboarding
---

# ONB-002: Skip onboarding
- launchApp:
    clearState: true
- tapOn: "Continue as Guest"

# Verify welcome screen
- assertVisible: "Welcome to Sofi Baby Tracker"

# Skip onboarding
- tapOn: "Skip"

# Should go directly to home
- assertVisible:
    text: "Feeding"
    timeout: 5000
- assertVisible: "Sleep"

---
# ONB-011: Add baby - no name validation
- launchApp:
    clearState: true
- tapOn: "Continue as Guest"

# Navigate to add baby screen
- tapOn: "Get Started"
- tapOn: "Next"
- tapOn: "Next"

# Try to add baby without name
- assertVisible: "Add Your Baby"
- tapOn: "Add Baby"

# Should show validation error
- assertVisible:
    text: "name"
    timeout: 3000
    optional: true

---
# ONB-012: Add baby - future birth date validation
- launchApp:
    clearState: true
- tapOn: "Continue as Guest"

# Navigate to add baby screen
- tapOn: "Get Started"
- tapOn: "Next"
- tapOn: "Next"

# Fill name
- inputText:
    text: "Test Baby"

# Note: Testing future date validation requires specific date picker interaction
# which may vary by platform. This test verifies the flow exists.
