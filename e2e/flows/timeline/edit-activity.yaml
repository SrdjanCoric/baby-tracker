appId: com.sofibaby.app
name: Edit Activity from Timeline
tags:
  - regression
  - timeline

---
- runFlow: ../../helpers/setup-with-activity.yaml

- runFlow: ../../helpers/open-timeline.yaml

- tapOn:
    id: "timeline-item"

- assertVisible:
    id: "edit-activity-screen"

- tapOn:
    id: "notes-input"
- inputText: "E2E test note"
- tapOn:
    id: "dismiss-keyboard"

- tapOn:
    id: "save-button"

- extendedWaitUntil:
    visible:
      id: "timeline-screen"
    timeout: 15000

# Reopening shows the saved note.
- tapOn:
    id: "timeline-item"

- assertVisible:
    id: "edit-activity-screen"

- assertVisible:
    id: "notes-input"
    text: "E2E test note"

# The note survives a relaunch.
- launchApp:
    clearState: false

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000

- runFlow: ../../helpers/open-timeline.yaml

- tapOn:
    id: "timeline-item"

- assertVisible:
    id: "notes-input"
    text: "E2E test note"
