appId: com.sofibaby.app
name: Bottle Feeding Entry
tags:
  - smoke
  - activities
  - feeding

---
- runFlow: ../../../helpers/setup-with-baby.yaml

# Tap feeding card
- tapOn:
    id: "feeding-card"

# Select bottle type
- tapOn:
    id: "type-bottle"

# Select content type - Formula
- tapOn:
    id: "content-formula"

# Use quick amount button instead of typing
- tapOn:
    id: "quick-amount-120"

# Reveal the save button without sending an Android Back action
- scrollUntilVisible:
    element:
      id: "save-bottle-button"
    direction: DOWN
    timeout: 10000

# Save bottle feeding
- tapOn:
    id: "save-bottle-button"

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 15000
