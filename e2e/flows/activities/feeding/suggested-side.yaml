appId: com.sofibaby.app
name: Suggested Side Display
tags:
  - regression
  - activities
  - feeding

---
- runFlow: ../../../helpers/setup-with-baby.yaml

# First do a feeding to establish a suggested side
- tapOn:
    id: "feeding-card"

- tapOn:
    id: "type-breast"

- tapOn:
    id: "start-left-button"

- extendedWaitUntil:
    visible:
      id: "stop-timer-button"
    timeout: 3000

- tapOn:
    id: "stop-timer-button"

# Wait for home screen
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 5000

# Now go back to feeding to verify suggested side shows
- tapOn:
    id: "feeding-card"

- tapOn:
    id: "type-breast"

# Verify suggested badge is visible
- assertVisible:
    id: "suggested-side-badge"

# Complete by starting and stopping on suggested side
- tapOn:
    id: "start-right-button"

- extendedWaitUntil:
    visible:
      id: "stop-timer-button"
    timeout: 3000

- tapOn:
    id: "stop-timer-button"

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 15000
