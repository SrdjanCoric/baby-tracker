appId: com.sofibaby.app
name: Suggested Side Display
tags:
  - regression
  - activities
  - feeding

---
- runFlow: ../../../helpers/setup-with-baby.yaml

# A side is only suggested once the last session totals two minutes or more,
# so log a past six-minute left-side feed instead of a one-second timer run.
- tapOn:
    id: "feeding-card"

- tapOn:
    id: "type-breast"

- tapOn:
    text: "Log Past Breastfeeding"

- tapOn:
    text: "Left Side"

# Move the start back a few hours so the feed does not end in the future.
# The inline spinner opens under the Start row (hour wheel near 49% x, 41% y);
# dragging it down selects earlier hours.
- tapOn:
    text: "Start Time Select Time"
- extendedWaitUntil:
    visible:
      text: "Done"
    timeout: 5000
- swipe:
    start: "49%,41%"
    end: "49%,51%"
    duration: 600
- tapOn:
    text: "Done"

# Double-tap selects the default value so typing replaces it.
- doubleTapOn:
    id: "duration-minutes-input"
- inputText: "6"

- tapOn:
    id: "side-minutes-left-input"
- inputText: "6"

- tapOn:
    id: "dismiss-keyboard"

- tapOn:
    text: "Log Breastfeeding"

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 15000

# Back on the breast form, only the right side is suggested.
- tapOn:
    id: "feeding-card"

- tapOn:
    id: "type-breast"

- assertVisible:
    id: "suggested-side-badge-right"
- assertNotVisible:
    id: "suggested-side-badge-left"

# Complete by starting and stopping on the suggested side.
- tapOn:
    id: "start-right-button"

- extendedWaitUntil:
    visible:
      id: "stop-timer-button"
    timeout: 3000

- tapOn:
    id: "stop-timer-button"

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 15000
