appId: com.sofibaby.app
name: Pumping Timer Flow
tags:
  - smoke
  - activities
  - pumping

---
- runFlow: ../../../helpers/setup-with-baby.yaml

# Tap pumping card
- tapOn:
    id: "pumping-card"

# Verify pumping screen
- assertVisible:
    id: "pumping-screen"

# Select side - this automatically starts the timer
- tapOn:
    id: "side-both"

# Selecting a side starts the timer; the stop button proves it is running.
- extendedWaitUntil:
    visible:
      id: "stop-timer-button"
    timeout: 3000

# Stop timer
- tapOn:
    id: "stop-timer-button"

# Enter volume (volume input appears after stopping)
- tapOn:
    id: "volume-input"
- inputText: "90"

# Dismiss keyboard before save
- tapOn:
    id: "dismiss-keyboard"

# Save
- tapOn:
    id: "save-button"

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 15000

- runFlow: ../../../helpers/open-timeline.yaml

# The saved session shows side and volume.
- assertVisible:
    text: "Pumping at .*\\. (Both|L: 0m, R: 0m) · (90 ml|3 oz).*"
