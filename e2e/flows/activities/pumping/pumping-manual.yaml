appId: com.sofibaby.app
name: Pumping Manual Entry
tags:
  - regression
  - activities
  - pumping

---
- runFlow: ../../../helpers/setup-with-baby.yaml

- tapOn:
    id: "pumping-card"

- tapOn:
    id: "log-past-pumping-button"

- tapOn:
    id: "volume-input"
- inputText: "120"
- tapOn:
    id: "dismiss-keyboard"

- tapOn:
    id: "save-button"

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 15000
