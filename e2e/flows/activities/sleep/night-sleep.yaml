appId: com.sofibaby.app
name: Night Sleep Timer Flow
tags:
  - regression
  - activities
  - sleep

---
- runFlow: ../../../helpers/setup-with-baby.yaml

- tapOn:
    id: "sleep-card"

- assertVisible:
    id: "sleep-screen"

- tapOn:
    id: "type-night"

- extendedWaitUntil:
    visible:
      id: "stop-timer-button"
    timeout: 3000

- tapOn:
    id: "stop-timer-button"

- assertVisible:
    id: "home-screen"
