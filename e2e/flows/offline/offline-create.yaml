appId: com.sofibaby.app
name: Create Activity While Offline
tags:
  - regression
  - offline

---
# Note: Maestro cannot directly control network state
# This test assumes the device is in airplane mode or network is disabled

- launchApp

# Should show offline indicator if offline
- assertVisible:
    id: "offline-banner"
    optional: true

# Create a diaper entry (quick operation)
- tapOn:
    id: "diaper-card"

- tapOn:
    id: "type-wet"

- tapOn:
    id: "save-button"

# Should save locally and show pending indicator
- assertVisible:
    id: "home-screen"

# May show pending sync indicator
- assertVisible:
    id: "pending-sync-badge"
    optional: true
