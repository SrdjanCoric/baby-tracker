appId: com.sofibaby.app
name: Timer Lock Visibility (Pre-seeded)
tags:
  - regression
  - multi-user

---
# This test requires pre-seeded data:
# INSERT INTO active_timers (baby_id, activity_type, user_id, user_name, started_at)
# VALUES ('e2e-baby-main', 'feeding', 'other-user-id', 'Other Caregiver', NOW());

- launchApp

- assertVisible:
    id: "home-screen"

# Tap feeding card
- tapOn:
    id: "feeding-card"

# Should see "In use by" banner or indicator
- assertVisible:
    id: "timer-lock-banner"
    optional: true

- assertVisible:
    text: "In use by"
    optional: true

# Start button should be disabled or show lock
- assertVisible:
    id: "timer-locked-indicator"
    optional: true

# Go back
- tapOn:
    id: "back-button"
