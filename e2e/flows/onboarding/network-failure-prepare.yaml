appId: com.sofibaby.app
name: Prepare caregiver join network failure

---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "new-owner-welcome-screen"
    timeout: 60000
- tapOn:
    id: "join-family-button"
- tapOn:
    id: "join-code-input"
- inputText: "E2EJ2345"
- tapOn:
    id: "continue-to-auth-button"
- tapOn:
    id: "email-input"
- inputText: "e2e-test@test.local"
- tapOn:
    id: "dismiss-keyboard"
- scrollUntilVisible:
    element:
      id: "dev-password-input"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "dev-password-input"
- inputText: "testpassword123"
- pressKey: Enter
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible:
      id: "join-family-submit-button"
    timeout: 30000
