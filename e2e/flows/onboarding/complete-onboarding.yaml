appId: com.sofibaby.app
name: Complete Full Onboarding Flow
tags:
  - regression
  - onboarding

---
- launchApp:
    clearState: true

# Welcome screen
- assertVisible:
    id: "welcome-screen"
- tapOn:
    text: "Get Started"

# Auth choice screen - continue as guest
- tapOn:
    id: "continue-as-guest-button"

# Features screen - next
- tapOn:
    id: "next-button"

# Preferences screen - next
- tapOn:
    id: "next-button"

# Sync screen - next
- assertVisible:
    id: "sync-screen"
- tapOn:
    id: "continue-button"

# Baby setup step
- assertVisible:
    id: "baby-setup-screen"
- tapOn:
    id: "baby-name-input"
- inputText: "E2E Test Baby"

# Select gender
- tapOn:
    id: "gender-female"
    optional: true

# Continue to home
- tapOn:
    id: "continue-button"

# Verify home screen with baby name
- assertVisible:
    id: "home-screen"
- assertVisible:
    id: "selected-baby-name"
