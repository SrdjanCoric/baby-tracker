appId: com.sofibaby.app
name: Production manual-code join and destructive confirmation

tags:
  - regression
  - onboarding
  - caregiver

---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "new-owner-welcome-screen"
    timeout: 60000
- tapOn:
    id: "join-family-button"
- tapOn:
    id: "join-code-input"
- inputText: "E2EJ2345"
- tapOn:
    id: "continue-to-auth-button"
- tapOn:
    id: "email-input"
- inputText: "e2e-test@test.local"
- tapOn:
    id: "dismiss-keyboard"
- scrollUntilVisible:
    element:
      id: "dev-password-input"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "dev-password-input"
- inputText: "testpassword123"
- pressKey: Enter
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible:
      id: "join-family-submit-button"
    timeout: 30000
- tapOn:
    id: "join-family-submit-button"
- assertVisible: "Delete your current baby data?"
- tapOn: "Cancel"
- assertVisible:
    id: "join-family-submit-button"
- tapOn:
    id: "join-family-submit-button"
- tapOn: "Delete my data and join"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
- assertVisible: "E2E Baby"
