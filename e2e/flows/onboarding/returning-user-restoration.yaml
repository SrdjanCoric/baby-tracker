appId: com.sofibaby.app
name: Production returning user restoration

tags:
  - regression
  - onboarding
  - returning-user

---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "new-owner-welcome-screen"
    timeout: 60000
- tapOn:
    id: "sign-in-button"
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 10000
- stopApp
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 30000
- tapOn:
    id: "email-input"
- inputText: "e2e-owner@test.local"
- tapOn:
    id: "dismiss-keyboard"
- scrollUntilVisible:
    element:
      id: "dev-password-input"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "dev-password-input"
- inputText: "testpassword123"
- pressKey: Enter
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
- assertVisible:
    id: "selected-baby-name"
    text: "^E2E Baby( Two)?$"
- assertNotVisible:
    id: "new-owner-baby-screen"
