appId: com.sofibaby.app
name: Production Welcome supports every locale

tags:
  - regression
  - onboarding
  - localization

---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "new-owner-welcome-screen"
    timeout: 60000
- tapOn:
    id: "current-language-button"
- tapOn:
    id: "welcome-language-en"
- assertVisible: "Care for your baby with confidence"
- assertVisible: "Track feeding, sleep, diapers, and more on your own or with family."
- tapOn:
    id: "current-language-button"
- tapOn:
    id: "welcome-language-sr"
- assertVisible: "Brinite o svojoj bebi sa sigurnošću"
- assertVisible: "Pratite hranjenje, spavanje, pelene i još mnogo toga sami ili sa porodicom."
- tapOn:
    id: "current-language-button"
- tapOn:
    id: "welcome-language-es"
- assertVisible: "Cuida a tu bebé con confianza"
- assertVisible: "Registra tomas, sueño, pañales y mucho más por tu cuenta o con tu familia."
- tapOn:
    id: "current-language-button"
- tapOn:
    id: "welcome-language-es-ES"
- assertVisible: "Cuida de tu bebé con confianza"
- assertVisible: "Registra tomas, sueño, pañales y mucho más por tu cuenta o con tu familia."
- tapOn:
    id: "current-language-button"
- tapOn:
    id: "welcome-language-fr"
- assertVisible: "Prenez soin de votre bébé en toute confiance"
- assertVisible: "Suivez les repas, le sommeil, les couches et bien plus seul ou avec votre famille."
- tapOn:
    id: "current-language-button"
- tapOn:
    id: "welcome-language-pt-PT"
- assertVisible: "Cuide do seu bebé com confiança"
- assertVisible: "Registe alimentação, sono, fraldas e muito mais sozinho ou com a família."
- tapOn:
    id: "current-language-button"
- tapOn:
    id: "welcome-language-pt-BR"
- assertVisible: "Cuide do seu bebê com confiança"
- assertVisible: "Registre mamadas, sono, fraldas e muito mais por conta própria ou com a família."
- tapOn:
    id: "current-language-button"
- tapOn:
    id: "welcome-language-de"
- assertVisible: "Kümmere dich mit Zuversicht um dein Baby"
- assertVisible: "Erfasse Füttern, Schlaf, Windeln und mehr allein oder mit deiner Familie."
- tapOn:
    id: "current-language-button"
- tapOn:
    id: "welcome-language-it"
- assertVisible: "Prenditi cura del tuo bambino con sicurezza"
- assertVisible: "Registra poppate, sonno, pannolini e molto altro da solo o con la famiglia."
