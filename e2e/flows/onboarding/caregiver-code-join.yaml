appId: com.sofibaby.app
name: Development Caregiver Code Join

tags:
  - development
  - onboarding
  - caregiver

---
- launchApp:
    clearState: true
    arguments:
      onboardingPreview: "true"

- extendedWaitUntil:
    visible:
      id: "new-owner-welcome-screen"
    timeout: 60000
- tapOn:
    id: "join-family-button"

- extendedWaitUntil:
    visible:
      id: "join-family-screen"
    timeout: 10000
- tapOn:
    id: "join-code-input"
- inputText: "E2EJ2345"
- tapOn:
    id: "continue-to-auth-button"

- extendedWaitUntil:
    visible:
      id: "close-button"
    timeout: 10000
- tapOn:
    id: "close-button"
- extendedWaitUntil:
    visible: "E2EJ-2345"
    timeout: 10000

- stopApp
- launchApp:
    clearState: false
    arguments:
      onboardingPreview: "true"

- extendedWaitUntil:
    visible: "E2EJ-2345"
    timeout: 60000
- tapOn:
    id: "continue-to-auth-button"
- extendedWaitUntil:
    visible:
      id: "email-input"
    timeout: 10000
- tapOn:
    id: "email-input"
- inputText: "e2e-test@test.local"
- tapOn:
    id: "dismiss-keyboard"
- scrollUntilVisible:
    element:
      id: "dev-password-input"
    direction: DOWN
    timeout: 10000
- tapOn:
    id: "dev-password-input"
- inputText: "testpassword123"
- pressKey: Enter
- tapOn:
    text: "Not Now"
    optional: true

- extendedWaitUntil:
    visible:
      id: "join-family-submit-button"
    timeout: 30000
- assertVisible: "E2EJ-2345"
- tapOn:
    id: "join-family-submit-button"

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
- assertVisible: "Shared Baby"
