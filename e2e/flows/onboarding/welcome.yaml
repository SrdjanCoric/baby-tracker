appId: com.sofibaby.app
name: Production onboarding welcome

tags:
  - smoke
  - onboarding

---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "new-owner-welcome-screen"
    timeout: 60000
- assertVisible:
    id: "current-language-button"
- assertVisible:
    id: "start-tracking-button"
- assertVisible:
    id: "join-family-button"
- assertVisible:
    id: "sign-in-button"
