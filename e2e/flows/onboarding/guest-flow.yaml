appId: com.sofibaby.app
name: Guest Flow - Complete Onboarding
tags:
  - smoke
  - onboarding

---
- launchApp:
    clearState: true

# Welcome screen - tap Get Started
- assertVisible:
    id: "welcome-screen"
- tapOn:
    text: "Get Started"

# Auth choice screen - continue as guest
- tapOn:
    id: "continue-as-guest-button"

# Features screen - next
- tapOn:
    id: "next-button"

# Preferences screen - next
- tapOn:
    id: "next-button"

# Sync screen - next
- assertVisible:
    id: "sync-screen"
- tapOn:
    id: "continue-button"

# Baby setup screen
- assertVisible:
    id: "baby-setup-screen"
- tapOn:
    id: "baby-name-input"
- inputText: "Test Baby"

# Continue through baby setup
- tapOn:
    id: "continue-button"

# Should arrive at home screen
- assertVisible:
    id: "home-screen"
