appId: com.sofibaby.app
name: Sign Out Flow
tags:
  - regression
  - auth

---
# Sign in with E2E test user
- runFlow: ../../helpers/login-e2e.yaml

# Navigate to settings
- tapOn:
    id: "settings-button"

# Scroll to sign out
- scrollUntilVisible:
    element:
      id: "sign-out-button"
    direction: DOWN

- tapOn:
    id: "sign-out-button"

# Confirm sign out in alert dialog
- tapOn: "Confirm"

# Signing out clears local data and returns to Home.
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 15000
- runFlow: ../../helpers/dismiss-dev-banner.yaml

# Settings now offers sign-in instead of sign-out.
- tapOn:
    id: "settings-button"
- scrollUntilVisible:
    element:
      id: "sign-in-to-sync"
    direction: DOWN
- assertVisible:
    id: "sign-in-to-sync"
