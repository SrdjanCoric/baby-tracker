appId: com.sofibaby.app
name: Invalid Email Validation

tags:
  - regression
  - auth

---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "new-owner-welcome-screen"
    timeout: 60000
- tapOn:
    id: "sign-in-button"
- tapOn:
    id: "email-input"
- inputText: "notanemail"
- tapOn:
    id: "send-magic-link-button"
- assertVisible:
    text: "valid email"
    optional: true
- tapOn:
    id: "email-input"
- eraseText
- inputText: "valid@email.com"
- tapOn:
    id: "send-magic-link-button"
