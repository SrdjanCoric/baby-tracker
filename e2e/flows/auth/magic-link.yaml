appId: com.sofibaby.app
name: Magic Link Sign In

tags:
  - regression
  - auth

---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "new-owner-welcome-screen"
    timeout: 60000
- tapOn:
    id: "sign-in-button"
- tapOn:
    id: "email-input"
- inputText: "test@example.com"
- tapOn:
    id: "send-magic-link-button"
- assertVisible:
    text: "Check your email"
    optional: true
