appId: com.sofibaby.app
name: Magic Link Sign In Validates Email

tags:
  - regression
  - auth

---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "new-owner-welcome-screen"
    timeout: 60000
- tapOn:
    id: "sign-in-button"

# A malformed address is rejected inline and nothing is sent.
- tapOn:
    id: "email-input"
- inputText: "notanemail"
- tapOn:
    id: "send-magic-link-button"
- assertVisible:
    text: "Invalid email format"
- assertNotVisible:
    text: "Check Your Email"

# A valid address sends the link (local Supabase catches the mail).
- tapOn:
    id: "email-input"
- eraseText
- inputText: "e2e-owner@test.local"
- tapOn:
    id: "send-magic-link-button"
- extendedWaitUntil:
    visible:
      text: "Check Your Email"
    timeout: 15000
- tapOn:
    text: "OK"
- assertVisible:
    id: "email-input"
