appId: com.sofibaby.app
name: E2E Auto Login
tags:
  - smoke
  - auth
  - requires-signin

---
- runFlow: ../../helpers/login-e2e.yaml

- assertVisible:
    id: "home-screen"

# A signed-in caregiver sees Sign out instead of Sign in to sync.
- tapOn:
    id: "settings-button"

- scrollUntilVisible:
    element:
      id: "sign-out-button"
    direction: DOWN

- assertNotVisible:
    id: "sign-in-to-sync"
