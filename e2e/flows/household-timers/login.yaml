appId: com.sofibaby.app
---
- launchApp:
    clearState: true
    arguments:
      e2eMode: "true"
      e2eEmail: "${E2E_EMAIL}"
      e2ePassword: "testpassword123"
      legacyOnboardingStatus: "completed"
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 600000
- tapOn:
    id: "selected-baby-name"
- tapOn:
    text: "^E2E Baby$"
- extendedWaitUntil:
    visible:
      id: "selected-baby-name"
      text: "^E2E Baby$"
    timeout: 10000
