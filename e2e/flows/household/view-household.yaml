appId: com.sofibaby.app
name: View Household Settings
tags:
  - household
  - requires-signin

---
# Sign in with E2E test user
- runFlow: ../../helpers/login-e2e.yaml

# Navigate to settings
- tapOn:
    id: "settings-button"

# Open household settings
- tapOn:
    id: "household-settings"

# Verify owner invitation controls are displayed
- extendedWaitUntil:
    visible:
      id: "caregiver-invitation-email"
    timeout: 15000
