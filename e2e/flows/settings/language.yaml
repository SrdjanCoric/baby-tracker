appId: com.sofibaby.app
name: Change Language Setting
tags:
  - regression
  - settings

---
- launchApp:
    clearState: true

- tapOn:
    id: "skip-button"

# Navigate to settings
- tapOn:
    id: "settings-button"

- tapOn:
    id: "language-setting"

# Select Serbian language
- tapOn:
    id: "language-sr"

# Verify language changed (look for translated text)
- assertVisible:
    text: "Srpski"

# Change back to English
- tapOn:
    id: "language-en"
