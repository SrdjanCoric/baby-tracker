appId: com.sofibaby.app
name: Change Language Setting

tags:
  - regression
  - settings

---
- runFlow: ../../helpers/setup-with-baby.yaml
- tapOn:
    id: "settings-button"
- tapOn:
    id: "language-setting"
- assertVisible:
    text: "Language"

# Picking Serbian translates the screen title.
- tapOn:
    id: "language-sr"
- assertVisible:
    text: "Jezik"

# Picking English translates it back.
- tapOn:
    id: "language-en"
- assertVisible:
    text: "Language"
