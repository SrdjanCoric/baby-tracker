appId: com.sofibaby.app
name: Configure Dashboard Cards
tags:
  - regression
  - settings

---
- launchApp:
    clearState: true

- tapOn:
    id: "skip-button"

# Pumping card starts visible on the dashboard
- scrollUntilVisible:
    element:
      id: "pumping-card"
    direction: DOWN

# Navigate to dashboard customization
- tapOn:
    id: "settings-button"

- scrollUntilVisible:
    element:
      id: "dashboard-config"
    direction: DOWN

- tapOn:
    id: "dashboard-config"

# Toggle pumping off
- tapOn:
    id: "toggle-pumping"

# Dismiss settings modal
- swipe:
    start: 50%, 15%
    end: 50%, 85%

# Verify pumping card is hidden
- assertNotVisible:
    id: "pumping-card"

# Re-open customization and toggle pumping back on
- tapOn:
    id: "settings-button"

- scrollUntilVisible:
    element:
      id: "dashboard-config"
    direction: DOWN

- tapOn:
    id: "dashboard-config"

- tapOn:
    id: "toggle-pumping"

- swipe:
    start: 50%, 15%
    end: 50%, 85%

# Verify pumping card is back
- scrollUntilVisible:
    element:
      id: "pumping-card"
    direction: DOWN

# Hide two cards, then reset to default
- tapOn:
    id: "settings-button"

- scrollUntilVisible:
    element:
      id: "dashboard-config"
    direction: DOWN

- tapOn:
    id: "dashboard-config"

- tapOn:
    id: "toggle-pumping"

- tapOn:
    id: "toggle-growth"

- tapOn:
    id: "reset-dashboard"

- tapOn:
    text: "Reset"

- swipe:
    start: 50%, 15%
    end: 50%, 85%

# Verify all eight cards are visible after reset
- assertVisible:
    id: "feeding-card"

- assertVisible:
    id: "sleep-card"

- assertVisible:
    id: "diaper-card"

- assertVisible:
    id: "tummyTime-card"

- scrollUntilVisible:
    element:
      id: "pumping-card"
    direction: DOWN

- scrollUntilVisible:
    element:
      id: "growth-card"
    direction: DOWN

- scrollUntilVisible:
    element:
      id: "milestones-card"
    direction: DOWN

- scrollUntilVisible:
    element:
      id: "health-card"
    direction: DOWN
