appId: com.sofibaby.app
name: Change Units Setting
tags:
  - regression
  - settings

---
- runFlow: ../../helpers/setup-with-baby.yaml

# Navigate to settings
- tapOn:
    id: "settings-button"

- tapOn:
    id: "units-setting"

# Switch to imperial
- tapOn:
    id: "units-imperial"

# Verify back on settings screen
- assertVisible:
    id: "units-setting"
