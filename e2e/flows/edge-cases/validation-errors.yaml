appId: com.sofibaby.app
name: Validation Errors
tags:
  - regression
  - edge-cases

---
- runFlow: ../../helpers/setup-with-baby.yaml

# Growth: zero weight is rejected.
- tapOn:
    id: "growth-card"
- tapOn:
    id: "weight-input"
- inputText: "0"
- tapOn:
    id: "dismiss-keyboard"
- tapOn:
    id: "save-button"
- assertVisible:
    text: "Weight must be positive"
- tapOn:
    text: "Close"

# Bottle: over 500 ml is rejected on the quick form.
- tapOn:
    id: "feeding-card"
- tapOn:
    id: "type-bottle"
- tapOn:
    id: "content-formula"
- tapOn:
    id: "volume-input"
- inputText: "600"
- tapOn:
    id: "dismiss-keyboard"
- tapOn:
    id: "save-bottle-button"
- assertVisible:
    text: "Amount seems too large \\(over 500ml\\)"

# Bottle: over 500 ml is rejected on the past-feeding form too.
- waitForAnimationToEnd
# The link is below the fixed save footer; scroll the form up first.
- swipe:
    start: "50%,70%"
    end: "50%,30%"
- tapOn:
    text: "Log Past Bottle Feeding"
- extendedWaitUntil:
    visible:
      text: "Enter the amount"
    timeout: 10000
- tapOn:
    text: ".*Formula"
- tapOn:
    text: "Enter the amount"
- inputText: "600"
- tapOn:
    id: "dismiss-keyboard"
- tapOn:
    text: "Log Bottle Feeding"
- assertVisible:
    text: "Amount seems too large \\(over 500ml\\)"

# The past-feeding form has no close control; relaunch to get back Home.
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000

# Pumping: over 500 ml is rejected on the past-session form.
- tapOn:
    id: "pumping-card"
- tapOn:
    id: "log-past-pumping-button"
- tapOn:
    id: "volume-input"
- inputText: "600"
- tapOn:
    id: "dismiss-keyboard"
- tapOn:
    id: "save-button"
- assertVisible:
    text: "Volume seems too large \\(over 500ml\\)"
