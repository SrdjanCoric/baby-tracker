appId: com.sofibaby.app
name: Empty State Displays

tags:
  - regression
  - edge-cases

---
- runFlow: ../../helpers/setup-with-baby.yaml
- tapOn:
    id: "timeline-tab"
- assertVisible:
    id: "empty-timeline"
    optional: true
- assertVisible:
    text: "No entries yet"
    optional: true
- tapOn:
    id: "stats-tab"
- scrollUntilVisible:
    element:
      id: "empty-stats"
    direction: DOWN
- assertVisible:
    id: "empty-stats"
    optional: true
