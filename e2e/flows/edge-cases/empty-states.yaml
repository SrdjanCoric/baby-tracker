appId: com.sofibaby.app
name: Empty State Displays

tags:
  - regression
  - edge-cases

---
- runFlow: ../../helpers/setup-with-baby.yaml

# A fresh baby has no Timeline entries.
- runFlow: ../../helpers/open-timeline.yaml
- assertVisible:
    id: "empty-timeline"
- assertVisible:
    text: "No entries yet"

# Statistics has no empty state of its own; it renders zero totals without crashing.
- tapOn:
    id: "stats-tab"
- extendedWaitUntil:
    visible:
      id: "statistics-content"
    timeout: 10000
