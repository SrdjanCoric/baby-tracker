appId: com.sofibaby.app
name: Switch Between Babies
tags:
  - regression
  - baby

---
- runFlow: ../../helpers/setup-with-baby.yaml
- runFlow: ../../helpers/add-second-baby.yaml

# Switching back selects the first baby.
- tapOn:
    id: "selected-baby-name"
- tapOn:
    text: "Test Baby"
- assertVisible:
    id: "selected-baby-name"
    text: "Test Baby"

# The selection survives a relaunch.
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
- assertVisible:
    id: "selected-baby-name"
    text: "Test Baby"
