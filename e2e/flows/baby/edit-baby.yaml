appId: com.sofibaby.app
name: Edit Baby Details
tags:
  - regression
  - baby

---
- runFlow: ../../helpers/setup-with-baby.yaml

- tapOn:
    id: "edit-baby-button"
- tapOn:
    id: "baby-name-input"
- eraseText
- inputText: "Updated Baby Name"
- pressKey: Enter
- tapOn:
    id: "save-baby-button"

- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 15000
- assertVisible:
    id: "selected-baby-name"
    text: "Updated Baby Name"

# The new name survives a relaunch.
- launchApp:
    clearState: false
- extendedWaitUntil:
    visible:
      id: "home-screen"
    timeout: 30000
- assertVisible:
    id: "selected-baby-name"
    text: "Updated Baby Name"
