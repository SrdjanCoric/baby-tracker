# Full regression suite - run nightly or before major releases
# Target: ~30 minutes

# === ONBOARDING ===
- runFlow: ../flows/onboarding/welcome.yaml
- runFlow: ../flows/onboarding/guest-flow.yaml
- runFlow: ../flows/onboarding/complete-onboarding.yaml
- runFlow: ../flows/onboarding/skip-onboarding.yaml
- runFlow: ../flows/onboarding/baby-validation.yaml

# === AUTHENTICATION ===
- runFlow: ../flows/auth/magic-link.yaml
- runFlow: ../flows/auth/sign-out.yaml
- runFlow: ../flows/auth/session-persistence.yaml
- runFlow: ../flows/auth/invalid-email.yaml

# === FEEDING ===
- runFlow: ../flows/activities/feeding/breastfeeding-timer.yaml
- runFlow: ../flows/activities/feeding/bottle-feeding.yaml
- runFlow: ../flows/activities/feeding/solids.yaml
- runFlow: ../flows/activities/feeding/suggested-side.yaml

# === SLEEP ===
- runFlow: ../flows/activities/sleep/nap-timer.yaml
- runFlow: ../flows/activities/sleep/night-sleep.yaml

# === DIAPER ===
- runFlow: ../flows/activities/diaper/quick-log.yaml
- runFlow: ../flows/activities/diaper/dry-diaper.yaml

# === PUMPING ===
- runFlow: ../flows/activities/pumping/pumping-timer.yaml
