# Authentication - Sign In Tests
# Test IDs: AUTH-010 through AUTH-014
appId: com.sofibaby.app
tags:
  - auth
  - critical
env:
  EMAIL: "test@example.com"
  PASSWORD: "TestPassword123!"
---

# AUTH-010: Email sign in - happy path
- launchApp:
    clearState: true
- assertVisible: "Welcome Back"

# Fill credentials
- inputText:
    text: "${EMAIL}"
    index: 0
- inputText:
    text: "${PASSWORD}"
    index: 1

# Sign in
- tapOn: "Sign In"

# Should redirect to home
- assertVisible:
    text: "Feeding"
    timeout: 10000
- assertVisible: "Sleep"
- assertVisible: "Diaper"

---
# AUTH-011: Email sign in - wrong password
- launchApp:
    clearState: true
- assertVisible: "Welcome Back"

- inputText:
    text: "${EMAIL}"
    index: 0
- inputText:
    text: "WrongPassword123!"
    index: 1

- tapOn: "Sign In"

# Should show error
- assertVisible:
    text: "Invalid"
    timeout: 5000
    optional: true
- assertVisible:
    text: "error"
    timeout: 5000
    optional: true

---
# AUTH-012: Email sign in - non-existent email
- launchApp:
    clearState: true
- assertVisible: "Welcome Back"

- inputText:
    text: "nonexistent-${TIMESTAMP}@example.com"
    index: 0
- inputText:
    text: "SomePassword123!"
    index: 1

- tapOn: "Sign In"

# Should show error
- assertVisible:
    text: "Invalid"
    timeout: 5000
    optional: true
- assertVisible:
    text: "error"
    timeout: 5000
    optional: true

---
# AUTH-013: Magic link request
- launchApp:
    clearState: true
- assertVisible: "Welcome Back"

- inputText:
    text: "magiclink-test@example.com"
    index: 0

- tapOn: "Sign in with Magic Link"

# Should show success message
- assertVisible:
    text: "Check your email"
    timeout: 5000
